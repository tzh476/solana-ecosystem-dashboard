name: Refresh Solana dashboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate public outputs
        run: python3 fetch_solana_dashboard.py

      - name: Commit refreshed data when it changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solana_snapshot.json report.md dashboard.html
          git commit -m "chore: refresh Solana ecosystem snapshot"
          git push
