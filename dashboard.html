<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solana Ecosystem Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: #101c19;
      --panel2: #132923;
      --line: #25443d;
      --text: #ecfff8;
      --muted: #9bb8ae;
      --accent: #8ef9c4;
      --warn: #ffd166;
      --bad: #ff7d7d;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #16352d, var(--bg) 40%);
      color: var(--text);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 32px; line-height: 1.1; }
    h2 { font-size: 17px; margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 92px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 720;
      white-space: nowrap;
    }
    section { margin-top: 24px; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; background: #0e1917; }
    tr:last-child td { border-bottom: 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      margin: 4px 6px 4px 0;
      color: var(--muted);
      background: #0d1715;
      font-size: 13px;
    }
    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #07100f;
      color: #c9ffe7;
      max-height: 320px;
    }
    @media (max-width: 880px) {
      header { display: block; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .value { font-size: 24px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="muted">Auto-updating public-data snapshot</p>
      <h1>Solana Ecosystem Dashboard</h1>
    </div>
    <div class="muted">Generated <span id="generated"></span></div>
  </header>

  <section class="grid" id="cards"></section>

  <section>
    <h2>Anomaly Flags</h2>
    <div id="anomalies"></div>
  </section>

  <section>
    <h2>Metric Table</h2>
    <table>
      <thead><tr><th>Metric</th><th>Value</th><th>Layer</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
  </section>

  <section>
    <h2>Data Sources</h2>
    <div id="sources"></div>
  </section>

  <section>
    <h2>Machine-Readable Snapshot</h2>
    <pre id="raw"></pre>
  </section>
</main>
<script id="snapshot" type="application/json">{&quot;generated_at&quot;: &quot;2026-09-22T11:37:07+00:00&quot;, &quot;sources&quot;: {&quot;solana_rpc&quot;: &quot;https://api.mainnet-beta.solana.com&quot;, &quot;coingecko_price&quot;: &quot;https://api.coingecko.com/api/v3/simple/price?ids=solana&amp;vs_currencies=usd&amp;include_24hr_change=true&quot;, &quot;defillama_sol_price_fallback&quot;: &quot;https://coins.llama.fi/prices/current/coingecko:solana&quot;, &quot;defillama_chains&quot;: &quot;https://api.llama.fi/v2/chains&quot;, &quot;defillama_solana_dex_volume&quot;: &quot;https://api.llama.fi/overview/dexs/solana?excludeTotalDataChart=true&amp;excludeTotalDataChartBreakdown=true&quot;, &quot;defillama_solana_stablecoins&quot;: &quot;https://stablecoins.llama.fi/stablecoincharts/Solana&quot;}, &quot;metrics&quot;: {&quot;network&quot;: {&quot;health&quot;: &quot;ok&quot;, &quot;epoch&quot;: 1040, &quot;absolute_slot&quot;: 449367308, &quot;block_height&quot;: 427407723, &quot;transaction_count&quot;: 551303022956, &quot;epoch_progress_pct&quot;: 20.210185185185185, &quot;avg_tps_24_samples&quot;: 4106.766666666666, &quot;latest_tps&quot;: 4274.15, &quot;avg_slot_time_ms_24_samples&quot;: 265.82264255349946, &quot;latest_slot_time_ms&quot;: 275.22935779816515}, &quot;validators&quot;: {&quot;active&quot;: 674, &quot;delinquent&quot;: 15, &quot;delinquent_pct&quot;: 2.1770682148040637, &quot;top10_stake_pct&quot;: 24.355917562673323}, &quot;economics&quot;: {&quot;sol_usd&quot;: 116.94, &quot;sol_usd_24h_change_pct&quot;: 0.4133424812694717, &quot;tvl_usd&quot;: 6456849472.256258, &quot;stablecoins_usd&quot;: 17108566383.69, &quot;dex_volume_24h_usd&quot;: 3509539674.75}, &quot;supply&quot;: {&quot;circulating&quot;: 587507816068832175, &quot;nonCirculating&quot;: 47023627543636230, &quot;nonCirculatingAccounts&quot;: [], &quot;total&quot;: 634531443612468405}}, &quot;samples&quot;: {&quot;recent_performance&quot;: [{&quot;numNonVoteTransactions&quot;: 110377, Transactions&quot;: 255167, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 449361946}]}, &quot;anomalies&quot;: [], &quot;errors&quot;: []}</script>
<script>
const snapshot = JSON.parse(document.getElementById('snapshot').textContent);
const m = snapshot.metrics;
const compact = (value) => {
  if (value === null || value === undefined || Number.isNaN(value)) return 'n/a';
  const abs = Math.abs(Number(value));
  if (abs >= 1e12) return (value / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9) return (value / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (value / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (value / 1e3).toFixed(2) + 'K';
  return Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 });
};
const pct = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(2) + '%';
const ms = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(0) + ' ms';
document.getElementById('generated').textContent = snapshot.generated_at;

const cards = [
  ['Network health', m.network.health || 'n/a', 'runtime'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Avg slot time', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Epoch progress', pct(m.network.epoch_progress_pct), 'runtime'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', pct(m.validators.delinquent_pct), 'validators'],

];
document.getElementById('cards').innerHTML = cards.map(([label, value, layer]) => `
  <article class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="muted">${layer}</div></article>
`).join('');

const rows = [
  ['Epoch', m.network.epoch, 'runtime'],
  ['Absolute slot', compact(m.network.absolute_slot), 'runtime'],
  ['Block height', compact(m.network.block_height), 'runtime'],
  ['Transactions processed', compact(m.network.transaction_count), 'runtime'],
  ['Average TPS, 24 samples', compact(m.network.avg_tps_24_samples), 'performance'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Average slot time, 24 samples', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Latest slot time', ms(m.network.latest_slot_time_ms), 'performance'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', compact(m.validators.delinquent), 'validators'],
  ['Delinquent validator ratio', pct(m.validators.delinquent_pct), 'validators'],
  ['Top 10 validator stake share', pct(m.validators.top10_stake_pct), 'validators'],

document.getElementById('metrics').innerHTML = rows.map(([name, value, layer]) => `<tr><td>${name}</td><td>${value}</td><td>${layer}</td></tr>`).join('');

document.getElementById('anomalies').innerHTML = snapshot.anomalies.length

  .map(([name, url]) => `<span class="pill">${name}: <a href="${url}" target="_blank" rel="noreferrer" style="color:var(--accent);margin-left:6px;">source</a></span>`)
  .join('');
document.getElementById('raw').textContent = JSON.stringify(snapshot, null, 2);
</script>

</html>
