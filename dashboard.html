<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solana Ecosystem Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: #101c19;
      --panel2: #132923;
      --line: #25443d;
      --text: #ecfff8;
      --muted: #9bb8ae;
      --accent: #8ef9c4;
      --warn: #ffd166;
      --bad: #ff7d7d;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #16352d, var(--bg) 40%);
      color: var(--text);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 32px; line-height: 1.1; }
    h2 { font-size: 17px; margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 92px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 720;
      white-space: nowrap;
    }
    section { margin-top: 24px; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; background: #0e1917; }
    tr:last-child td { border-bottom: 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      margin: 4px 6px 4px 0;
      color: var(--muted);
      background: #0d1715;
      font-size: 13px;
    }
    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #07100f;
      color: #c9ffe7;
      max-height: 320px;
    }
    @media (max-width: 880px) {
      header { display: block; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .value { font-size: 24px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="muted">Auto-updating public-data snapshot</p>
      <h1>Solana Ecosystem Dashboard</h1>
    </div>
    <div class="muted">Generated <span id="generated"></span></div>
  </header>

  <section class="grid" id="cards"></section>

  <section>
    <h2>Anomaly Flags</h2>
    <div id="anomalies"></div>
  </section>

  <section>
    <h2>Metric Table</h2>
    <table>
      <thead><tr><th>Metric</th><th>Value</th><th>Layer</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
  </section>

  <section>
    <h2>Data Sources</h2>
    <div id="sources"></div>
  </section>

  <section>
    <h2>Machine-Readable Snapshot</h2>
    <pre id="raw"></pre>
  </section>
</main>
<script id="snapshot" type="application/json">{&quot;generated_at&quot;: &quot;2026-10-25T20:49:48+00:00&quot;, &quot;sources&quot;: {&quot;solana_rpc&quot;: &quot;https://api.mainnet-beta.solana.com&quot;, &quot;coingecko_price&quot;: &quot;https://api.coingecko.com/api/v3/simple/price?ids=solana&amp;vs_currencies=usd&amp;include_24hr_change=true&quot;, &quot;defillama_sol_price_fallback&quot;: &quot;https://coins.llama.fi/prices/current/coingecko:solana&quot;, &quot;defillama_chains&quot;: &quot;https://api.llama.fi/v2/chains&quot;, &quot;defillama_solana_dex_volume&quot;: &quot;https://api.llama.fi/overview/dexs/solana?excludeTotalDataChart=true&amp;excludeTotalDataChartBreakdown=true&quot;, &quot;defillama_solana_stablecoins&quot;: &quot;https://stablecoins.llama.fi/stablecoincharts/Solana&quot;}, &quot;metrics&quot;: {&quot;network&quot;: {&quot;health&quot;: &quot;ok&quot;, &quot;epoch&quot;: 1068, &quot;absolute_slot&quot;: 461399022, &quot;block_height&quot;: 439426676, &quot;transaction_count&quot;: 563729015252, &quot;epoch_progress_pct&quot;: 5.329166666666667, &quot;avg_tps_24_samples&quot;: 2051.9465277777776, &quot;latest_tps&quot;: 1638.8166666666666, &quot;avg_slot_time_ms_24_samples&quot;: 212.04300324007522, &quot;latest_slot_time_ms&quot;: 209.7902097902098}, &quot;validators&quot;: {&quot;active&quot;: 665, &quot;delinquent&quot;: 25, &quot;delinquent_pct&quot;: 3.6231884057971016, &quot;top10_stake_pct&quot;: 24.574009673828993}, &quot;economics&quot;: {&quot;sol_usd&quot;: 101.55, &quot;sol_usd_24h_change_pct&quot;: 0.09135334778043559, &quot;tvl_usd&quot;: 5765295620.347243, &quot;stablecoins_usd&quot;: 15847342930.75, &quot;dex_volume_24h_usd&quot;: 1423041369.8}, &quot;supply&quot;: {&quot;circulating&quot;: 589819916036163664, &quot;nonCirculating&quot;: 46637414413304948, &quot;nonCirculatingAccounts&quot;: [], &quot;total&quot;: 636457330449468612}}, &quot;samples&quot;: {&quot;recent_performance&quot;: [{&quot;numNonVoteTransactions&quot uot;: 60, &quot;slot&quot;: 461395741}, {&quot;numNonVoteTransactions&quot;: 106463, &quot;numSlots&quot;: 278, &quot;numTransactions&quot;: 106463, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461395459}, {&quot;numNonVoteTransactions&quot;: 102050, &quot;numSlots&quot;: 282, &quot;numTransactions&quot;: 102050, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461395181}, {&quot;numNonVoteTransactions&quot;: 109926, &quot;numSlots&quot;: 283, &quot;numTransactions&quot;: 109926, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461394899}, {&quot;numNonVoteTransactions&quot;: 134418, &quot;numSlots&quot;: 285, &quot;numTransactions&quot;: 134418, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461394616}, {&quot;numNonVoteTransactions&quot;: 222015, &quot;numSlots&quot;: 279, &quot;numTransactions&quot;: 222015, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461394331}, {&quot;numNonVoteTransactions&quot;: 130205, &quot;numSlots&quot;: 284, &quot;numTransactions&quot;: 130205, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461394052}, {&quot;numNonVoteTransactions&quot;: 105401, &quot;numSlots&quot;: 285, &quot;numTransactions&quot;: 105401, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461393768}, {&quot;numNonVoteTransactions&quot;: 92391, &quot;numSlots&quot;: 276, &quot;numTransactions&quot;: 92391, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461393483}, {&quot;numNonVoteTransactions&quot;: 101940, &quot;numSlots&quot;: 282, &quot;numTransactions&quot;: 101940, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461393207}, {&quot;numNonVoteTransactions&quot;: 103869, &quot;numSlots&quot;: 284, &quot;numTransactions&quot;: 103869, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461392925}, {&quot;numNonVoteTransactions&quot;: 142431, &quot;numSlots&quot;: 283, &quot;numTransactions&quot;: 142431, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461392641}, {&quot;numNonVoteTransactions&quot;: 162215, &quot;numSlots&quot;: 279, &quot;numTransactions&quot;: 162215, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 461392358}]}, &quot;anomalies&quot;: [], &quot;errors&quot;: []}</script>
<script>
const snapshot = JSON.parse(document.getElementById('snapshot').textContent);
const m = snapshot.metrics;
const compact = (value) => {
  if (value === null || value === undefined || Number.isNaN(value)) return 'n/a';
  const abs = Math.abs(Number(value));
  if (abs >= 1e12) return (value / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9) return (value / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (value / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (value / 1e3).toFixed(2) + 'K';
  return Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 });
};
const pct = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(2) + '%';
const ms = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(0) + ' ms';
document.getElementById('generated').textContent = snapshot.generated_at;

const cards = [
  ['Network health', m.network.health || 'n/a', 'runtime'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Avg slot time', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Epoch progress', pct(m.network.epoch_progress_pct), 'runtime'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', pct(m.validators.delinquent_pct), 'validators'],
  ['SOL price', m.economics.sol_usd ? '$' + Number(m.economics.sol_usd).toFixed(2) : 'n/a', 'markets'],
  ['TVL', m.economics.tvl_usd ? '$' + compact(m.economics.tvl_usd) : 'n/a', 'markets'],
  ['DEX volume, 24h', m.economics.dex_volume_24h_usd ? '$' + compact(m.economics.dex_volume_24h_usd) : 'n/a', 'markets'],
];
document.getElementById('cards').innerHTML = cards.map(([label, value, layer]) => `
  <article class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="muted">${layer}</div></article>
`).join('');

const rows = [
  ['Epoch', m.network.epoch, 'runtime'],
  ['Absolute slot', compact(m.network.absolute_slot), 'runtime'],
  ['Block height', compact(m.network.block_height), 'runtime'],
  ['Transactions processed', compact(m.network.transaction_count), 'runtime'],
  ['Average TPS, 24 samples', compact(m.network.avg_tps_24_samples), 'performance'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Average slot time, 24 samples', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Latest slot time', ms(m.network.latest_slot_time_ms), 'performance'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', compact(m.validators.delinquent), 'validators'],
  ['Delinquent validator ratio', pct(m.validators.delinquent_pct), 'validators'],
  ['Top 10 validator stake share', pct(m.validators.top10_stake_pct), 'validators'],
  ['SOL 24h change', pct(m.economics.sol_usd_24h_change_pct), 'markets'],
  ['Solana TVL', m.economics.tvl_usd ? '$' + compact(m.economics.tvl_usd) : 'n/a', 'markets'],
  ['Stablecoins', m.economics.stablecoins_usd ? '$' + compact(m.economics.stablecoins_usd) : 'n/a', 'markets'],
  ['DEX volume, 24h', m.economics.dex_volume_24h_usd ? '$' + compact(m.economics.dex_volume_24h_usd) : 'n/a', 'markets'],
];
document.getElementById('metrics').innerHTML = rows.map(([name, value, layer]) => `<tr><td>${name}</td><td>${value}</td><td>${layer}</td></tr>`).join('');

document.getElementById('anomalies').innerHTML = snapshot.anomalies.length
  ? snapshot.anomalies.map(a => `<span class="pill ${a.severity === 'watch' ? 'warn' : 'ok'}">${a.severity} / ${a.metric}: ${a.message}</span>`).join('')
  : '<span class="pill ok">No threshold-based anomalies detected</span>';

document.getElementById('sources').innerHTML = Object.entries(snapshot.sources)
  .map(([name, url]) => `<span class="pill">${name}: <a href="${url}" target="_blank" rel="noreferrer" style="color:var(--accent);margin-left:6px;">source</a></span>`)
  .join('');
document.getElementById('raw').textContent = JSON.stringify(snapshot, null, 2);
</script>
</body>
</html>
