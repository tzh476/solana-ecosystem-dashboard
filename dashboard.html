<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solana Ecosystem Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: #101c19;
      --panel2: #132923;
      --line: #25443d;
      --text: #ecfff8;
      --muted: #9bb8ae;
      --accent: #8ef9c4;
      --warn: #ffd166;
      --bad: #ff7d7d;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #16352d, var(--bg) 40%);
      color: var(--text);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 32px; line-height: 1.1; }
    h2 { font-size: 17px; margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 92px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 720;
      white-space: nowrap;
    }
    section { margin-top: 24px; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; background: #0e1917; }
    tr:last-child td { border-bottom: 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      margin: 4px 6px 4px 0;
      color: var(--muted);
      background: #0d1715;
      font-size: 13px;
    }
    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #07100f;
      color: #c9ffe7;
      max-height: 320px;
    }
    @media (max-width: 880px) {
      header { display: block; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .value { font-size: 24px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="muted">Auto-updating public-data snapshot</p>
      <h1>Solana Ecosystem Dashboard</h1>
    </div>
    <div class="muted">Generated <span id="generated"></span></div>
  </header>

  <section class="grid" id="cards"></section>

  <section>
    <h2>Anomaly Flags</h2>
    <div id="anomalies"></div>
  </section>

  <section>
    <h2>Metric Table</h2>
    <table>
      <thead><tr><th>Metric</th><th>Value</th><th>Layer</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
  </section>

  <section>
    <h2>Data Sources</h2>
    <div id="sources"></div>
  </section>

  <section>
    <h2>Machine-Readable Snapshot</h2>
    <pre id="raw"></pre>
  </section>
</main>
<script id="snapshot" type="application/json">{&quot;generated_at&quot;: &quot;2026-08-26T20:03:24+00:00&quot;, &quot;sources&quot;: {&quot;solana_rpc&quot;: &quot;https://api.mainnet-beta.solana.com&quot;, &quot;coingecko_price&quot;: &quot;https://api.coingecko.com/api/v3/simple/price?ids=solana&amp;vs_currencies=usd&amp;include_24hr_change=true&quot;, &quot;defillama_sol_price_fallback&quot;: &quot;https://coins.llama.fi/prices/current/coingecko:solana&quot;, &quot;defillama_chains&quot;: &quot;https://api.llama.fi/v2/chains&quot;, &quot;defillama_solana_dex_volume&quot;: &quot;https://api.llama.fi/overview/dexs/solana?excludeTotalDataChart=true&amp;excludeTotalDataChartBreakdown=true&quot;, &quot;defillama_solana_stablecoins&quot;: &quot;https://stablecoins.llama.fi/stablecoincharts/Solana&quot;}, &quot;metrics&quot;: {&quot;network&quot;: {&quot;health&quot;: &quot;ok&quot;, &quot;epoch&quot;: 1023, &quot;absolute_slot&quot;: 441941428, &quot;block_height&quot;: 419989833, &quot;transaction_count&quot;: 542142548422, &quot;epoch_progress_pct&quot;: 1.2564814814814815, &quot;avg_tps_24_samples&quot;: 4395.959027777778, &quot;latest_tps&quot;: 4659.216666666666, &quot;avg_slot_time_ms_24_samples&quot;: 366.85187218826906, &quot;latest_slot_time_ms&quot;: 368.09815950920245}, &quot;validators&quot;: {&quot;active&quot;: 685, &quot;delinquent&quot;: 11, &quot;delinquent_pct&quot;: 1.5804597701149428, &quot;top10_stake_pct&quot;: 24.290644649808108}, &quot;economics&quot;: {&quot;sol_usd&quot;: 96.72, &quot;sol_usd_24h_change_pct&quot;: -1.1277559238263977, &quot;tvl_usd&quot;: 5565848826.757744, &quot;stablecoins_usd&quot;: 16247268848.21, &quot;dex_volume_24h_usd&quot;: 2934986439.19}, &quot;supply&quot;: {&quot;circulating&quot;: 584063744556005262, &quot;nonCirculating&quot;: 48906432069693148, &quot;nonCirculatingAccounts&quot;: [], &quot;total&quot;: 632970176625698410}}, &quot;samples&quot;: {&quot;recent_performance&quot;: [{&quot;numNonVoteTransactions&quot &quot;: 60, &quot;slot&quot;: 441939609}, {&quot;numNonVoteTransactions&quot;: 141497, &quot;numSlots&quot;: 163, &quot;numTransactions&quot;: 252741, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441939448}, {&quot;numNonVoteTransactions&quot;: 135264, &quot;numSlots&quot;: 159, &quot;numTransactions&quot;: 243444, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441939285}, {&quot;numNonVoteTransactions&quot;: 147868, &quot;numSlots&quot;: 166, &quot;numTransactions&quot;: 261124, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441939126}, {&quot;numNonVoteTransactions&quot;: 141264, &quot;numSlots&quot;: 162, &quot;numTransactions&quot;: 251860, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938960}, {&quot;numNonVoteTransactions&quot;: 145317, &quot;numSlots&quot;: 163, &quot;numTransactions&quot;: 256234, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938798}, {&quot;numNonVoteTransactions&quot;: 156938, &quot;numSlots&quot;: 167, &quot;numTransactions&quot;: 267970, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938635}, {&quot;numNonVoteTransactions&quot;: 121533, &quot;numSlots&quot;: 165, &quot;numTransactions&quot;: 234297, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938468}, {&quot;numNonVoteTransactions&quot;: 119521, &quot;numSlots&quot;: 165, &quot;numTransactions&quot;: 232067, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938303}, {&quot;numNonVoteTransactions&quot;: 139021, &quot;numSlots&quot;: 165, &quot;numTransactions&quot;: 251395, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441938138}, {&quot;numNonVoteTransactions&quot;: 139970, &quot;numSlots&quot;: 165, &quot;numTransactions&quot;: 252540, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441937973}, {&quot;numNonVoteTransactions&quot;: 155678, &quot;numSlots&quot;: 168, &quot;numTransactions&quot;: 270070, &quot;samplePeriodSecs&quot;: 60, &quot;slot&quot;: 441937808}, {&quot;numNonVoteTransactions&quot;: 122071, &quot;numS <script>
const snapshot = JSON.parse(document.getElementById('snapshot').textContent);
const m = snapshot.metrics;
const compact = (value) => {
  if (value === null || value === undefined || Number.isNaN(value)) return 'n/a';
  const abs = Math.abs(Number(value));
  if (abs >= 1e12) return (value / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9) return (value / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (value / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (value / 1e3).toFixed(2) + 'K';
  return Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 });
};
const pct = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(2) + '%';
const ms = (value) => value === null || value === undefined ? 'n/a' : Number(value).toFixed(0) + ' ms';
document.getElementById('generated').textContent = snapshot.generated_at;

const cards = [
  ['Network health', m.network.health || 'n/a', 'runtime'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Avg slot time', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Epoch progress', pct(m.network.epoch_progress_pct), 'runtime'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', pct(m.validators.delinquent_pct), 'validators'],
  ['SOL price', m.economics.sol_usd ? '$' + Number(m.economics.sol_usd).toFixed(2) : 'n/a', 'markets'],
  ['TVL', m.economics.tvl_usd ? '$' + compact(m.economics.tvl_usd) : 'n/a', 'markets'],

];
document.getElementById('cards').innerHTML = cards.map(([label, value, layer]) => `
  <article class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="muted">${layer}</div></article>
`).join('');

const rows = [
  ['Epoch', m.network.epoch, 'runtime'],
  ['Absolute slot', compact(m.network.absolute_slot), 'runtime'],
  ['Block height', compact(m.network.block_height), 'runtime'],
  ['Transactions processed', compact(m.network.transaction_count), 'runtime'],
  ['Average TPS, 24 samples', compact(m.network.avg_tps_24_samples), 'performance'],
  ['Latest TPS', compact(m.network.latest_tps), 'performance'],
  ['Average slot time, 24 samples', ms(m.network.avg_slot_time_ms_24_samples), 'performance'],
  ['Latest slot time', ms(m.network.latest_slot_time_ms), 'performance'],
  ['Active validators', compact(m.validators.active), 'validators'],
  ['Delinquent validators', compact(m.validators.delinquent), 'validators'],
  ['Delinquent validator ratio', pct(m.validators.delinquent_pct), 'validators'],
  ['Top 10 validator stake share', pct(m.validators.top10_stake_pct), 'validators'],
  ['SOL 24h change', pct(m.economics.sol_usd_24h_change_pct), 'markets'],
  ['Solana TVL', m.economics.tvl_usd ? '$' + compact(m.economics.tvl_usd) : 'n/a', 'markets'],
  ['Stablecoins', m.economics.stablecoins_usd ? '$' + compact(m.economics.stablecoins_usd) : 'n/a', 'markets'],
  ['DEX volume, 24h', m.economics.dex_volume_24h_usd ? '$' + compact(m.economics.dex_volume_24h_usd) : 'n/a', 'markets'],
];
document.getElementById('metrics').innerHTML = rows.map(([name, value, layer]) => `<tr><td>${name}</td><td>${value}</td><td>${layer}</td></tr>`).join('');

document.getElementById('anomalies').innerHTML = snapshot.anomalies.length
  ? snapshot.anomalies.map(a => `<span class="pill ${a.severity === 'watch' ? 'warn' : 'ok'}">${a.severity} / ${a.metric}: ${a.message}</span>`).join('')
  : '<span class="pill ok">No threshold-based anomalies detected</span>';

document.getElementById('sources').innerHTML = Object.entries(snapshot.sources)
  .map(([name, url]) => `<span class="pill">${name}: <a href="${url}" target="_blank" rel="noreferrer" style="color:var(--accent);margin-left:6px;">source</a></span>`)
  .join('');
document.getElementById('raw').textContent = JSON.stringify(snapshot, null, 2);
</script>

</html>
